<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjetas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f1;--sf:#fff;--tx:#1d2a26;--mu:#6b7a74;--ac:#1f6f5c;--bd:#d5ddd8;--bad:#b4442f}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--sf:#1d2623;--tx:#e6eeea;--mu:#93a39c;--ac:#5fc2a5;--bd:#2f3d38;--bad:#e5836f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:680px;margin:0 auto;padding:12px 16px 48px}
h1{font-size:26px;margin:14px 0 4px}h2{font-size:18px;margin:20px 0 8px}
.s,.cnt,label,button,input,textarea,select,.li{font-family:system-ui,sans-serif}
.s{color:var(--mu);font-size:14px;margin:0 0 14px}.cnt{font-size:13px;color:var(--mu)}
button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;display:inline-block}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:9px 11px;margin:0 0 10px;font-size:15px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.deck{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);margin-bottom:8px}
.n{color:#2f6fd0}.l{color:var(--bad)}.r{color:#2f7d4f}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:22px 16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;font-size:22px;white-space:pre-wrap;margin:12px 0}
.card hr{width:60%;border:0;border-top:1px solid var(--bd);margin:6px 0}
.b{color:var(--ac);font-weight:700}
.im,.th{max-width:100%;max-height:260px;border-radius:8px}.th{max-height:56px}
audio{max-width:100%}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g button{padding:10px 2px}.g small{display:block;color:var(--mu);font-size:11px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;cursor:pointer}
.li span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li em{color:var(--mu);font-style:normal}
.col{display:flex;align-items:flex-end;gap:3px;height:90px;margin:8px 0}.col i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.empty{color:var(--mu);text-align:center;padding:22px 0}
</style>
</head>
<body>
<main><nav id="nav"></nav><div id="app"></div></main>
<script>
var DB,MEM={},DAY=864e5,S={decks:[],cards:[],log:{},nt:{d:"",n:0},lim:20},view="home",cur="",q=[],show=false,done=0,ed=null,flt="",E={},RC="",mr,msg="";
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open("tarjetas-offline",1);r.onupgradeneeded=function(){r.result.createObjectStore("meta");r.result.createObjectStore("media")};r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function gp(st,k){return new Promise(function(res){if(!DB)return res(MEM[st+k]);var x=DB.transaction(st).objectStore(st).get(k);x.onsuccess=function(){res(x.result)};x.onerror=function(){res()}})}
function pp(st,k,v){return new Promise(function(res){if(!DB){MEM[st+k]=v;return res()}var t=DB.transaction(st,"readwrite");t.objectStore(st).put(v,k);t.oncomplete=res;t.onerror=res})}
function save(){return pp("meta","S",S)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function td(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function eod(){var d=new Date();d.setHours(23,59,59,999);return+d}
function go(v,x){view=v;if(x!==undefined)cur=x;msg="";render()}

/* ---- mazos ---- */
function allDecks(){var m={};S.decks.forEach(function(d){var p=d.split("::");for(var i=1;i<=p.length;i++)m[p.slice(0,i).join("::")]=1});return Object.keys(m).sort()}
function inDeck(c,d){return c.deck===d||c.deck.indexOf(d+"::")===0}
function newLeft(){return Math.max(0,S.lim-(S.nt.d===td()?S.nt.n:0))}
function counts(d){var n=0,l=0,r=0,now=Date.now(),e=eod();S.cards.forEach(function(c){if(!inDeck(c,d))return;if(c.st==="new")n++;else if(c.st==="learn"){if(c.due<=now+12e5)l++}else if(c.due<=e)r++});return{n:Math.min(n,newLeft()),l:l,r:r}}
function home(){
  var h='<h1>Mazos</h1><p class="s">Todo se guarda en este navegador, sin cuenta. Usa «Mazo::Submazo» para anidar.</p>',ds=allDecks();
  if(!ds.length)h+='<div class="empty">Crea tu primer mazo abajo.</div>';
  ds.forEach(function(d){var c=counts(d),p=d.split("::"),tot=c.n+c.l+c.r;
    h+='<div class="deck" style="margin-left:'+(p.length-1)*18+'px"><div><b>'+esc(p[p.length-1])+'</b><div class="cnt"><span class="n">'+c.n+'</span> nuevas · <span class="l">'+c.l+'</span> aprendiendo · <span class="r">'+c.r+'</span> repaso</div></div><div class="row" style="margin:0"><button class="p" '+(tot?'':'disabled')+' onclick="study(\''+esc(d)+'\')">Estudiar</button><button onclick="renDeck(\''+esc(d)+'\')">Renombrar</button><button onclick="delDeck(\''+esc(d)+'\')">Borrar</button></div></div>'});
  return h+'<h2>Nuevo mazo</h2><div class="row"><input id="dn" placeholder="Idiomas::Inglés" style="flex:1;margin:0"><button class="p" onclick="addDeck()">Crear mazo</button></div>';
}
function addDeck(){var v=document.getElementById("dn").value.trim();if(!v)return;if(S.decks.indexOf(v)<0)S.decks.push(v);save();render()}
function renDeck(d){var n=(prompt("Nuevo nombre",d)||"").trim();if(!n||n===d)return;function f(x){return x===d?n:x.indexOf(d+"::")===0?n+x.slice(d.length):x}S.decks=S.decks.map(f);S.cards.forEach(function(c){c.deck=f(c.deck)});if(S.decks.indexOf(n)<0)S.decks.push(n);save();render()}
function delDeck(d){if(!confirm("¿Borrar «"+d+"», sus submazos y todas sus tarjetas?"))return;S.cards=S.cards.filter(function(c){return!inDeck(c,d)});S.decks=S.decks.filter(function(x){return x!==d&&x.indexOf(d+"::")!==0});save();render()}

/* ---- tarjetas ---- */
var CL=/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g;
function sides(c){
  if(c.type==="cloze"){var t=esc(c.f);
    return{ft:t.replace(CL,function(x,n,a,h){return n==c.ord?'<span class="b">['+(h||"…")+']</span>':a}),fi:c.fi,fa:c.fa,bt:t.replace(CL,function(x,n,a){return n==c.ord?'<span class="b">'+a+'</span>':a})+(c.b?'\n'+esc(c.b):""),bi:"",ba:""}}
  if(c.type==="rev"&&c.ord===1)return{ft:esc(c.b),fi:c.bi,fa:c.ba,bt:esc(c.f),bi:c.fi,ba:c.fa};
  return{ft:esc(c.f),fi:c.fi,fa:c.fa,bt:esc(c.b),bi:c.bi,ba:c.ba};
}
function blk(t,i,a){return(t?'<div>'+t+'</div>':'')+(i?'<img class="im" data-m="'+i+'">':'')+(a?'<audio controls data-m="'+a+'"></audio>':'')}
function hydrate(){document.querySelectorAll("[data-m]").forEach(function(el){gp("media",el.dataset.m).then(function(b){if(b)el.src=URL.createObjectURL(b)})})}
function resetE(k){var o=E;E={deck:o.deck||allDecks()[0]||"",type:o.type||"basic",tags:o.tags||"",f:"",b:"",fi:"",fa:"",bi:"",ba:""};if(k)E=k}
function mrow(s){
  var h='<div class="row">';
  h+=E[s+"i"]?'<img class="th" data-m="'+E[s+"i"]+'"><button onclick="rm(\''+s+'i\')">Quitar imagen</button>':'<label class="btn">+ Imagen<input type="file" accept="image/*" hidden onchange="pick(\''+s+'\',\'i\',this)"></label>';
  h+=E[s+"a"]?'<audio controls data-m="'+E[s+"a"]+'"></audio><button onclick="rm(\''+s+'a\')">Quitar audio</button>':'<label class="btn">+ Audio<input type="file" accept="audio/*" hidden onchange="pick(\''+s+'\',\'a\',this)"></label><button onclick="rec(\''+s+'\')">'+(RC===s?'■ Detener':'● Grabar')+'</button>';
  return h+'</div>';
}
function rm(k){E[k]="";render()}
function toBlob(f){return createImageBitmap(f).then(function(b){var s=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(function(r){c.toBlob(r,"image/jpeg",.85)})})}
function store(k,b){var id=uid();return pp("media",id,b).then(function(){E[k]=id;render()})}
function pick(s,k,inp){var f=inp.files[0];if(!f)return;(k==="i"?toBlob(f):Promise.resolve(f)).then(function(b){return store(s+k,b)}).catch(function(){alert("No se pudo leer el archivo.")})}
function rec(s){
  if(RC){mr.stop();RC="";return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){var ch=[];mr=new MediaRecorder(st);mr.ondataavailable=function(e){ch.push(e.data)};mr.onstop=function(){st.getTracks().forEach(function(t){t.stop()});store(s+"a",new Blob(ch,{type:mr.mimeType}))};mr.start();RC=s;render()}).catch(function(){alert("No hay acceso al micrófono. Puedes subir un archivo de audio.")});
}
function form(){
  var ds=allDecks(),h='';
  if(!ds.length)return'<div class="empty">Primero crea un mazo en «Mazos».</div>';
  h+='<div class="row"><select id="fd" style="flex:1;margin:0" onchange="E.deck=this.value">'+ds.map(function(d){return'<option'+(d===E.deck?' selected':'')+'>'+esc(d)+'</option>'}).join("")+'</select>';
  if(!ed)h+='<select style="flex:1;margin:0" onchange="E.type=this.value;render()"><option value="basic"'+(E.type==="basic"?" selected":"")+'>Básica</option><option value="rev"'+(E.type==="rev"?" selected":"")+'>Básica y reversa</option><option value="cloze"'+(E.type==="cloze"?" selected":"")+'>Cloze</option></select>';
  h+='</div>';
  var cz=E.type==="cloze";
  h+='<textarea placeholder="'+(cz?'Texto con {{c1::huecos}}':'Frente')+'" oninput="E.f=this.value">'+esc(E.f)+'</textarea>'+mrow("f");
  h+='<textarea placeholder="'+(cz?'Información extra (opcional)':'Reverso')+'" oninput="E.b=this.value">'+esc(E.b)+'</textarea>'+(cz?'':mrow("b"));
  h+='<input placeholder="Etiquetas separadas por espacio" value="'+esc(E.tags)+'" oninput="E.tags=this.value">';
  return h+'<div class="row"><button class="p" onclick="saveNote()">'+(ed?'Guardar cambios':'Añadir tarjeta')+'</button>'+(ed?'<button onclick="ed=null;resetE();go(\'browse\')">Cancelar</button>':'')+'</div>'+(msg?'<div class="cnt">'+msg+'</div>':'');
}
function saveNote(){
  var tg=E.tags.split(/[\s,]+/).filter(Boolean),cz=E.type==="cloze";
  if(!E.f.trim()||(!cz&&!E.b.trim()&&!E.bi&&!E.ba)){alert("Falta el frente o el reverso.");return}
  if(cz&&!/\{\{c\d+::/.test(E.f)){alert("Añade al menos un hueco: {{c1::respuesta}}");return}
  if(ed){S.cards.forEach(function(c){if(c.nid===ed){c.deck=E.deck;c.f=E.f;c.b=E.b;c.fi=E.fi;c.fa=E.fa;c.bi=E.bi;c.ba=E.ba;c.tags=tg}});ed=null;save();resetE();go("browse");return}
  var nid=uid(),ords=[0];
  if(E.type==="rev")ords=[0,1];
  if(cz){var m,o={};CL.lastIndex=0;while(m=CL.exec(E.f))o[m[1]]=1;ords=Object.keys(o).map(Number)}
  ords.forEach(function(k){S.cards.push({id:uid(),nid:nid,ord:k,type:E.type,deck:E.deck,f:E.f,b:E.b,fi:E.fi,fa:E.fa,bi:E.bi,ba:E.ba,tags:tg,st:"new",step:0,due:Date.now(),int:0,ease:2.5,lapses:0,reps:0})});
  msg="Añadida ("+ords.length+(ords.length>1?" tarjetas":" tarjeta")+").";var d=E.deck,t=E.type,g=E.tags;E={deck:d,type:t,tags:g,f:"",b:"",fi:"",fa:"",bi:"",ba:""};save();render();
}

/* ---- explorar ---- */
function blist(){
  var s=flt.trim().toLowerCase(),r=S.cards.filter(function(c){if(!s)return true;if(s.indexOf("tag:")===0)return c.tags.indexOf(s.slice(4))>=0;return(c.f+" "+c.b+" "+c.tags.join(" ")+" "+c.deck).toLowerCase().indexOf(s)>=0}),h="";
  r.slice(0,200).forEach(function(c){h+='<div class="li" onclick="editC(\''+c.id+'\')"><span>'+esc(c.f)+(c.type==="cloze"?' <em>(c'+c.ord+')</em>':c.type==="rev"&&c.ord?' <em>(reversa)</em>':'')+'</span><em>'+esc(c.deck)+(c.tags.length?' · '+esc(c.tags.join(" ")):'')+'</em><button onclick="event.stopPropagation();delC(\''+c.id+'\')" aria-label="Borrar">✕</button></div>'});
  return(h||'<div class="empty">Sin resultados.</div>')+(r.length>200?'<div class="cnt">Mostrando 200 de '+r.length+'.</div>':'');
}
function browse(){return'<h1>Explorar</h1><p class="s">'+S.cards.length+' tarjetas. Busca por texto, mazo o «tag:etiqueta».</p><input placeholder="Buscar…" value="'+esc(flt)+'" oninput="flt=this.value;document.getElementById(\'bl\').innerHTML=blist();hydrate()"><div id="bl">'+blist()+'</div>'}
function editC(id){var c=S.cards.find(function(x){return x.id===id});ed=c.nid;E={deck:c.deck,type:c.type,tags:c.tags.join(" "),f:c.f,b:c.b,fi:c.fi||"",fa:c.fa||"",bi:c.bi||"",ba:c.ba||""};view="add";render()}
function delC(id){if(!confirm("¿Borrar esta tarjeta?"))return;S.cards=S.cards.filter(function(c){return c.id!==id});save();render()}

/* ---- estudio (SM-2 simplificado, pasos 1 y 10 min) ---- */
var ST=[1,10];
function grade(c,g){
  var m=6e4;
  if(c.st==="rev"){
    if(g===0){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.int=Math.max(1,Math.round(c.int*.5));c.st="learn";c.step=0;c.due=Date.now()+ST[0]*m;return}
    c.int=g===1?Math.max(c.int+1,Math.round(c.int*1.2)):g===2?Math.max(c.int+1,Math.round(c.int*c.ease)):Math.max(c.int+2,Math.round(c.int*c.ease*1.3));
    if(g===1)c.ease=Math.max(1.3,c.ease-.15);if(g===3)c.ease+=.15;
    c.reps++;c.due=Date.now()+c.int*DAY;return;
  }
  if(c.st==="new"){c.st="learn";c.step=0}
  if(g===0){c.step=0;c.due=Date.now()+ST[0]*m;return}
  if(g===1){c.due=Date.now()+ST[c.step]*m;return}
  if(g===2&&c.step+1<ST.length){c.step++;c.due=Date.now()+ST[c.step]*m;return}
  c.st="rev";c.int=g===3?4:Math.max(1,c.int||1);c.reps++;c.due=Date.now()+c.int*DAY;
}
function fmt(ms){var m=Math.round(ms/6e4);if(m<60)return Math.max(1,m)+" min";var d=Math.round(ms/DAY);return d<30?d+" d":d<365?Math.round(d/30)+" m":(d/365).toFixed(1)+" a"}
function lab(c,g){var t=JSON.parse(JSON.stringify(c));grade(t,g);return fmt(t.due-Date.now())}
function study(d){
  cur=d;var now=Date.now(),e=eod(),a=S.cards.filter(function(c){return inDeck(c,d)});
  q=a.filter(function(c){return c.st==="learn"&&c.due<=now+12e5}).concat(a.filter(function(c){return c.st==="rev"&&c.due<=e}).sort(function(x,y){return x.due-y.due}),a.filter(function(c){return c.st==="new"}).slice(0,newLeft()));
  show=false;done=0;view="study";render();
}
function studyV(){
  if(!q.length)return'<div class="empty"><h2>¡Al día!</h2><p>Repasaste '+done+' tarjetas en esta sesión.</p><button class="p" onclick="go(\'home\')">Volver a los mazos</button></div>';
  var c=q[0],s=sides(c);
  var h='<div class="row" style="justify-content:space-between"><button onclick="go(\'home\')">← Salir</button><span class="cnt">'+esc(cur)+' · quedan '+q.length+'</span></div><div class="bar"><i style="width:'+done/(done+q.length)*100+'%"></i></div>';
  h+='<div class="card">'+blk(s.ft,s.fi,s.fa)+(show?'<hr>'+blk(s.bt,s.bi,s.ba):'')+'</div>';
  if(!show)return h+'<button class="p" style="width:100%;padding:13px" onclick="show=true;render()">Mostrar respuesta (espacio)</button>';
  var n=["Otra vez","Difícil","Bien","Fácil"];h+='<div class="g">';
  for(var g=0;g<4;g++)h+='<button onclick="rate('+g+')">'+n[g]+'<small>'+lab(c,g)+'</small></button>';
  return h+'</div>';
}
function rate(g){
  var c=q.shift();if(c.st==="new"){S.nt=S.nt.d===td()?S.nt:{d:td(),n:0};S.nt.n++}
  grade(c,g);S.log[td()]=(S.log[td()]||0)+1;
  if(c.st==="learn")q.push(c);else done++;
  show=false;save();render();
}
document.addEventListener("keydown",function(e){
  if(view!=="study"||!q.length||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(!show&&(e.key===" "||e.key==="Enter")){e.preventDefault();show=true;render()}
  else if(show&&/^[1-4]$/.test(e.key))rate(+e.key-1);
});

/* ---- estadísticas ---- */
function stats(){
  var t={n:0,l:0,y:0,m:0},now=new Date();
  S.cards.forEach(function(c){if(c.st==="new")t.n++;else if(c.st==="learn")t.l++;else if(c.int>=21)t.m++;else t.y++});
  var h='<h1>Estadísticas</h1><p class="s">Hoy: '+(S.log[td()]||0)+' repasos · Total de tarjetas: '+S.cards.length+'</p>';
  h+='<div class="li"><span>Nuevas</span><b>'+t.n+'</b></div><div class="li"><span>Aprendiendo</span><b>'+t.l+'</b></div><div class="li"><span>Jóvenes (menos de 21 días)</span><b>'+t.y+'</b></div><div class="li"><span>Maduras (21 días o más)</span><b>'+t.m+'</b></div>';
  var v=[],mx=1;for(var i=13;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(),n=S.log[k]||0;v.push(n);mx=Math.max(mx,n)}
  h+='<h2>Repasos, últimos 14 días</h2><div class="col">'+v.map(function(n){return'<i title="'+n+'" style="height:'+n/mx*100+'%"></i>'}).join("")+'</div>';
  var f=[0,0,0,0,0,0,0];S.cards.forEach(function(c){if(c.st==="rev"){var d=Math.ceil((c.due-Date.now())/DAY);if(d>=0&&d<7)f[d]++}});
  mx=Math.max.apply(null,f.concat(1));
  return h+'<h2>Vencen en los próximos 7 días</h2><div class="col">'+f.map(function(n){return'<i title="'+n+'" style="height:'+n/mx*100+'%"></i>'}).join("")+'</div>';
}

/* ---- copia, importar ---- */
function d2b(u){var p=u.split(","),m=p[0].match(/:(.*?);/)[1],s=atob(p[1]),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}
function b2d(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)})}
function ids(){var o={};S.cards.forEach(function(c){["fi","fa","bi","ba"].forEach(function(k){if(c[k])o[c[k]]=1})});return Object.keys(o)}
function exportAll(){
  var m={};Promise.all(ids().map(function(id){return gp("media",id).then(function(b){return b?b2d(b).then(function(u){m[id]=u}):0})})).then(function(){
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({S:S,media:m})],{type:"application/json"}));a.download="tarjetas-copia-"+td()+".json";a.click();
  });
}
function importAll(inp){
  var f=inp.files[0];if(!f)return;if(!confirm("Esto reemplazará todo lo actual. ¿Continuar?"))return;
  var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);S=j.S;Promise.all(Object.keys(j.media).map(function(id){return pp("media",id,d2b(j.media[id]))})).then(function(){save();msg="Copia restaurada.";render()})}catch(e){alert("Archivo no válido.")}};r.readAsText(f);
}
function importText(){
  var d=document.getElementById("td").value,L=document.getElementById("tt").value.split("\n"),n=0;
  L.forEach(function(l){var p=l.split(/\t|;/);if(p.length<2||!p[0].trim()||!p[1].trim())return;S.cards.push({id:uid(),nid:uid(),ord:0,type:"basic",deck:d,f:p[0].trim(),b:p[1].trim(),fi:"",fa:"",bi:"",ba:"",tags:(p[2]||"").split(/[\s,]+/).filter(Boolean),st:"new",step:0,due:Date.now(),int:0,ease:2.5,lapses:0,reps:0});n++});
  msg=n+" tarjetas importadas.";save();render();
}
function backup(){
  var ds=allDecks();
  return'<h1>Copia y ajustes</h1><p class="s">Tus datos viven en este navegador. Haz copias de seguridad con frecuencia.</p>'+
  '<h2>Nuevas tarjetas por día</h2><input type="number" min="0" value="'+S.lim+'" onchange="S.lim=Math.max(0,+this.value||0);save()">'+
  '<h2>Copia de seguridad (incluye imágenes y audio)</h2><div class="row"><button class="p" onclick="exportAll()">Descargar copia</button><label class="btn">Restaurar copia<input type="file" accept=".json" hidden onchange="importAll(this)"></label></div>'+
  '<h2>Importar texto (frente ; reverso ; etiquetas)</h2>'+(ds.length?'<select id="td">'+ds.map(function(d){return'<option>'+esc(d)+'</option>'}).join("")+'</select><textarea id="tt" placeholder="hola ; hello ; saludos"></textarea><button onclick="importText()">Importar</button>':'<div class="empty">Crea un mazo primero.</div>')+(msg?'<div class="cnt" style="margin-top:8px">'+msg+'</div>':'');
}

function render(){
  var N=[["home","Mazos"],["add","Añadir"],["browse","Explorar"],["stats","Estadísticas"],["bk","Copia"]];
  document.getElementById("nav").innerHTML=N.map(function(n){return'<button class="'+(view===n[0]?'on':'')+'" onclick="ed=null;if(\''+n[0]+'\'===\'add\')resetE();go(\''+n[0]+'\')">'+n[1]+'</button>'}).join("");
  if(view==="add"&&!E.f&&!ed&&E.deck===undefined)resetE();
  document.getElementById("app").innerHTML=view==="home"?home():view==="add"?'<h1>'+(ed?'Editar':'Añadir')+'</h1>'+form():view==="browse"?browse():view==="stats"?stats():view==="bk"?backup():studyV();
  hydrate();
}
idbOpen().then(function(){return gp("meta","S")}).then(function(s){if(s)S=s;resetE();render()});
